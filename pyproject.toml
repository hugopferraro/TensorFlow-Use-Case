[project]
name = "dry-bean-tensorflow-study"
version = "1.0.0"
description = "Reproducible deep-learning classification study for the UCI Dry Bean dataset"
requires-python = ">=3.11,<3.13"
dependencies = [
  "tensorflow==2.20.0",
  "keras-tuner==1.4.7",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.16.3",
  "scikit-learn==1.7.2",
  "matplotlib==3.10.7",
  "seaborn==0.13.2",
  "openpyxl==3.1.5",
  "joblib==1.5.2",
  "jupyter==1.1.1",
  "nbconvert==7.16.6",
  "jupytext==1.17.3",
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

